<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rich Text Editor - Thymeleaf</title>

    <style>
        /* Styling for Toolbar */
        .toolbar {
            background: #f0f0f0;
            padding: 5px;
            border-radius: 5px;
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }
        .toolbar button, .toolbar select {
            padding: 5px;
            border: none;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            border-radius: 3px;
            font-size: 14px;
        }
        .toolbar button:hover {
            background-color: #0056b3;
        }
        .toolbar select {
            background-color: white;
            color: black;
            border: 1px solid #ccc;
            cursor: pointer;
        }

        /* Rich Text Editor Styling */
        .rich-text {
            width: 100%;
            height: 120px;
            padding: 10px;
            font-size: 14px;
            font-family: Arial, sans-serif;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: white;
            overflow-y: auto;
        }

        .section-header {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
            background-color: #ddd;
            padding: 8px;
            border-radius: 5px;
        }

        .section-content {
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <!-- ✅ GLOBAL TOOLBAR WITH FONT FAMILY & FONT SIZE -->
    <div class="toolbar">
        <button onclick="formatText('bold')"><b>B</b></button>
        <button onclick="formatText('italic')"><i>I</i></button>
        <button onclick="formatText('underline')"><u>U</u></button>
        <button onclick="formatText('insertOrderedList')">1. List</button>
        <button onclick="formatText('insertUnorderedList')">• List</button>
        <button onclick="formatText('justifyLeft')">Left</button>
        <button onclick="formatText('justifyCenter')">Center</button>
        <button onclick="formatText('justifyRight')">Right</button>
        <button onclick="formatText('justifyFull')">Justify</button>

        <!-- ✅ Font Family Dropdown -->
        <select onchange="changeFontFamily(this.value)">
            <option value="">Font</option>
            <option value="Arial">Arial</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Courier New">Courier New</option>
            <option value="Georgia">Georgia</option>
            <option value="Verdana">Verdana</option>
        </select>

        <!-- ✅ Font Size Dropdown -->
        <select onchange="changeFontSize(this.value)">
            <option value="">Size</option>
            <option value="2">Small</option>
            <option value="3">Normal</option>
            <option value="5">Large</option>
            <option value="7">Extra Large</option>
        </select>

        <button onclick="formatText('undo')">↺ Undo</button>
        <button onclick="formatText('redo')">↻ Redo</button>
    </div>

    <div class="section-header">Analysis Section</div>
    <div class="section-content">

        <!-- ✅ ALL FIELDS BELOW GLOBAL TOOLBAR -->

        <!-- INLINE ROW: Analysis -->
        <div style="margin-bottom: 10px;">
            <label style="min-width: 150px;">Analysis:</label>
            <div id="analysis" contenteditable="true" class="rich-text" oninput="syncContent('analysis')"></div>
            <input type="hidden" id="analysisHidden" th:field="*{analysis}">
        </div>

        <!-- INLINE ROW: Alert Name -->
        <div style="margin-bottom: 10px;">
            <label style="min-width: 150px;">Alert Name:</label>
            <div id="alertName" contenteditable="true" class="rich-text" oninput="syncContent('alertName')"></div>
            <input type="hidden" id="alertNameHidden" th:field="*{alertName}">
        </div>

        <!-- INLINE ROW: Flow -->
        <div style="margin-bottom: 10px;">
            <label style="min-width: 150px;">Flow:</label>
            <div id="flow" contenteditable="true" class="rich-text" oninput="syncContent('flow')"></div>
            <input type="hidden" id="flowHidden" th:field="*{flow}">
        </div>

        <!-- INLINE ROW: Customer Impact -->
        <div style="margin-bottom: 10px;">
            <label style="min-width: 150px;">Customer Impact:</label>
            <div id="customerImpact" contenteditable="true" class="rich-text" oninput="syncContent('customerImpact')"></div>
            <input type="hidden" id="customerImpactHidden" th:field="*{customerImpact}">
        </div>

        <!-- INLINE ROW: Splunk Queries -->
        <div style="margin-bottom: 10px;">
            <label style="min-width: 150px;">Splunk Queries:</label>
            <div id="splunkQueries" contenteditable="true" class="rich-text" oninput="syncContent('splunkQueries')"></div>
            <input type="hidden" id="splunkQueriesHidden" th:field="*{splunkQueries}">
        </div>

        <!-- INLINE ROW: Follow Up Items -->
        <div style="margin-bottom: 10px;">
            <label style="min-width: 150px;">Follow Up Items:</label>
            <div id="followUpItems" contenteditable="true" class="rich-text" oninput="syncContent('followUpItems')"></div>
            <input type="hidden" id="followUpItemsHidden" th:field="*{followUpItems}">
        </div>

    </div>

    <script>
        function formatText(command) {
            document.execCommand(command, false, null);
        }

        function changeFontSize(size) {
            document.execCommand("fontSize", false, size);
        }

        function changeFontFamily(font) {
            document.execCommand("fontName", false, font);
        }

        function syncContent(fieldId) {
            let content = document.getElementById(fieldId).innerHTML;
            document.getElementById(fieldId + 'Hidden').value = content;
        }
    </script>

</body>
</html>

 .customer-experience {
	text-align: justify;
	text-justify: inter-word;
	width: 100%; /* Ensures proper justification */
	word-wrap: break-word; /* Wrap long words */
}
		
<td class="customer-experience" th:text="${item.customerExp}"></td> dashboard.html
<td class="text customer-experience">${item.customerExp}</td> - search.html
