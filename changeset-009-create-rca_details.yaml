databaseChangeLog:
  - changeSet:
      id: 009_rca_details
      author: sathya
      changes:
        - sql:
            dbms: oracle
            splitStatements: false
            stripComments: true
            sql: |
              CREATE TABLE rca_details (
                id NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
                incident_number VARCHAR2(100),
                priority VARCHAR2(50),
                impacted_lobs VARCHAR2(255),
                incident_description CLOB,
                sharepoint_description CLOB,
                rca_sharepoint_link CLOB,
                rca_sharepoint_folder VARCHAR2(2000),
                team VARCHAR2(20),
                update_user VARCHAR2(100),
                update_date TIMESTAMP,
                rca_folder_id NUMBER,
                CONSTRAINT fk_rca_folder FOREIGN KEY (rca_folder_id) REFERENCES rca_folder(id)
              )